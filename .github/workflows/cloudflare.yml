name: Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'zine.ziggy'
      - 'scripts/build-site.sh'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT: penny-goblin

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zine 0.14.0
        run: |
          curl --fail --location --retry 3 https://github.com/kristoff-it/zine/releases/download/v0.14.0/x86_64-linux-musl.tar.xz -o /tmp/zine.tar.xz
          echo '897642f46c3872a6311f2ab3d4c622f5f8625bfee8e1de2d0de42597c1385629  /tmp/zine.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zine"
          tar -xJf /tmp/zine.tar.xz -C "$RUNNER_TEMP/zine"
          echo "$RUNNER_TEMP/zine" >> "$GITHUB_PATH"

      - name: Build site
        run: bash scripts/build-site.sh

      - name: Skip without Cloudflare credentials
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy."

      # The Pages project is created on the first deploy if it doesn't exist.
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          preCommands: npx wrangler pages project create ${{ env.PROJECT }} --production-branch=main || true
          command: pages deploy public --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true
