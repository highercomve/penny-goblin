name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  ZIG_VERSION: 0.16.0
  # NVIDIA GPUs the Linux WebKit build's scanner runs on: Turing (RTX 20)
  # to Blackwell (RTX 50; 120a for its FP4 MMA), plus PTX for newer ones.
  CUDA_ARCHS: 75,86,89,120a
  VULKAN_SDK_VERSION: 1.4.357.0
  WEBVIEW2_VERSION: 1.0.4258.31
jobs:
  test:
    name: Ledger, UI and sync tests
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install platform dependencies
        run: pacman -Syu --noconfirm --needed git pkgconf gtk4 webkitgtk-6.0 wayland wayland-protocols libxkbcommon libxtst libx11 dbus ttf-dejavu python python-pip python-gobject nodejs xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: python scripts/check-vendor.py
      - run: zig build test -Dvision=false --summary all
      - run: zig build test-ui -Drenderer=oriel -Dvision=false --summary all
      - run: node --test scripts/reports.test.cjs
      - name: Python sync and network tests
        run: |
          python -m venv .helper-venv
          .helper-venv/bin/python -m pip install -r scripts/helper-requirements.txt
          .helper-venv/bin/python scripts/research_jobs_test.py
          .helper-venv/bin/python scripts/research_network_test.py
      - name: WebKit review tests (isolated synthetic fixtures)
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          GDK_BACKEND: x11
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a python scripts/research_ui_test.py
  linux:
    name: Linux x86_64 (${{ matrix.renderer }})
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest
    # A CUDA backend rebuild (a new Oriel/ggml or CUDA version) is ~70 min of nvcc.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        renderer: [oriel, webview]
    steps:
      - name: Install platform dependencies
        # Vulkan headers, loader and glslc: the Oriel build's libggml-vulkan.so.
        run: pacman -Syu --noconfirm --needed git pkgconf gtk4 webkitgtk-6.0 wayland wayland-protocols libxkbcommon libxtst libx11 dbus ttf-dejavu python python-pip squashfs-tools curl vulkan-headers spirv-headers vulkan-icd-loader shaderc
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Fetch Zig packages (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 20)); done; exit 1
      # The WebKit build's scanner runs on NVIDIA GPUs through CUDA:
      # libggml-cuda.so (cuBLAS from the system's CUDA 13 runtime; without
      # it, or without an NVIDIA driver, scans run on the CPU). One per Oriel
      # snapshot, GPU list and CUDA version: from the Actions cache, else the
      # prebuilt one on this repository's release of the same name (nvcc on a
      # hosted runner takes over an hour; scripts/publish-cuda-backend.sh
      # uploads one built on a faster machine), else compiled here.
      - name: CUDA backend key
        if: matrix.renderer == 'webview'
        id: cuda
        run: |
          ggml=$(sha256sum vendor/oriel/build.zig.zon vendor/oriel/build/ggml.zig | sha256sum | cut -c1-16)
          # CUDA's major version: the library links libcublas.so.<major>.
          echo "key=ggml-cuda-$ggml-${CUDA_ARCHS//,/_}-cuda$(pacman -Si cuda | awk '/^Version/{split($3, v, "."); print v[1]}')" >> "$GITHUB_OUTPUT"
      - name: Restore the CUDA backend
        if: matrix.renderer == 'webview'
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: cuda-cache/libggml-cuda.so
          key: ${{ steps.cuda.outputs.key }}
      - name: Download the prebuilt CUDA backend
        if: matrix.renderer == 'webview' && steps.cuda-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -S --noconfirm --needed github-cli
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release download '${{ steps.cuda.outputs.key }}' -R '${{ github.repository }}' -p libggml-cuda.so -D cuda-cache \
            || echo "No prebuilt ${{ steps.cuda.outputs.key }}: compiling it."
      - name: Build the CUDA backend
        if: matrix.renderer == 'webview' && hashFiles('cuda-cache/libggml-cuda.so') == ''
        run: |
          pacman -S --noconfirm --needed cuda gcc
          export CUDA_PATH=/opt/cuda PATH="/opt/cuda/bin:$PATH"
          # A non-login shell skips /etc/profile.d: nvcc's supported host compiler.
          eval "$(grep '^export NVCC_CCBIN=' /etc/profile.d/cuda.sh)"
          zig build -Drenderer=webview -Doptimize=ReleaseSafe -Dggml_cuda -Dcuda_arch="$CUDA_ARCHS" -p zig-out-cuda --summary all
          mkdir -p cuda-cache
          cp zig-out-cuda/bin/libggml-cuda.so cuda-cache/
      - name: Build
        run: |
          if [ '${{ matrix.renderer }}' = webview ]; then
            bash scripts/build-linux.sh webview -Dggml_cuda_prebuilt="$PWD/cuda-cache/libggml-cuda.so"
          else
            # Any GPU vendor through Vulkan (Settings → Receipt scanner → Use GPU).
            bash scripts/build-linux.sh oriel -Dggml_vulkan
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: penny-goblin-linux-x86_64-${{ matrix.renderer }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  windows:
    # WebView2 (the system's Edge WebView) and Vulkan for the scanner.
    name: Windows x86_64 (WebView2, Vulkan)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore the Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}
      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$ver"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile vulkansdk.exe
          Start-Process -Wait -FilePath .\vulkansdk.exe -ArgumentList "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install"
      - name: Vulkan SDK, NSIS and WebView2Loader.dll
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & "$root\Bin\glslc.exe" --version
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          "ORIEL_MAKENSIS=${env:ProgramFiles(x86)}\NSIS\makensis.exe" >> $env:GITHUB_ENV
          # WebView2Loader.dll from Microsoft's WebView2 SDK (NuGet).
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_VERSION" -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath webview2
          "WEBVIEW2_LOADER=$PWD\webview2\runtimes\win-x64\native\WebView2Loader.dll" >> $env:GITHUB_ENV
      - name: Fetch Zig packages (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 20)); done; exit 1
      - name: Build the installer
        run: |
          zig build package-nsis -Drenderer=webview -Doptimize=ReleaseSafe -Dggml_vulkan -Dwebview2-loader="$WEBVIEW2_LOADER" --summary all
          mkdir -p dist
          cp zig-out/package/*.exe dist/
          (cd dist && sha256sum *.exe > SHA256SUMS-windows)
      - uses: actions/upload-artifact@v4
        with:
          name: penny-goblin-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  macos:
    # WKWebView and Metal for the scanner (Oriel's default on macOS).
    name: macOS arm64 (WebKit, Metal)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch Zig packages (retried)
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 20)); done; exit 1
      - name: Build the disk image
        run: |
          zig build package-dmg -Drenderer=webview -Doptimize=ReleaseSafe --summary all
          mkdir -p dist
          cp zig-out/package/*.dmg dist/
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS-macos)
      - uses: actions/upload-artifact@v4
        with:
          name: penny-goblin-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  android:
    name: Android arm64 (Oriel)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install pinned Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev wayland-protocols libxkbcommon-dev
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build and verify APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          python3 scripts/build-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: penny-goblin-android-arm64-oriel
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    # A version tag (v0.2.5) publishes its builds on the public site
    # repository's Releases page: this source repository is private, and so
    # would be its releases. Fixed asset names keep the website's
    # releases/latest/download/... links working for every version.
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows, macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the assets for the website's links
        run: |
          mkdir release
          cp artifacts/penny-goblin-linux-x86_64-oriel/*-oriel.AppImage release/penny-goblin-linux-x86_64-oriel.AppImage
          cp artifacts/penny-goblin-linux-x86_64-webview/*-webview.AppImage release/penny-goblin-linux-x86_64-webview.AppImage
          cp artifacts/penny-goblin-android-arm64-oriel/*-android-arm64.apk release/penny-goblin-android-arm64.apk
          cp artifacts/penny-goblin-windows-x86_64/*.exe release/penny-goblin-windows-x86_64-setup.exe
          cp artifacts/penny-goblin-macos-arm64/*.dmg release/penny-goblin-macos-arm64.dmg
          (cd release && sha256sum * > SHA256SUMS)
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{found = ($2 == v)} found && !/^## /' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Penny Goblin $version." > notes.md
          printf '\nBuilt from %s. Linux needs GTK4 and WebKitGTK 6 (the WebKit build scans on NVIDIA GPUs with the CUDA 13 runtime); Windows needs the WebView2 runtime (Windows 10/11); macOS needs macOS 13 on Apple silicon; Android needs Android 10 or newer.\n' "${GITHUB_SHA::12}" >> notes.md
      - name: Publish on penny-goblin-site
        env:
          # A token that can write the public site repository's releases
          # (fine-grained: highercomve/penny-goblin-site, Contents read and write).
          GH_TOKEN: ${{ secrets.SITE_RELEASE_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo highercomve/penny-goblin-site \
            --title "Penny Goblin ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
  website:
    name: Zine website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Zine 0.14.0
        run: |
          curl --fail --location --retry 3 https://github.com/kristoff-it/zine/releases/download/v0.14.0/x86_64-linux-musl.tar.xz -o /tmp/zine.tar.xz
          echo '897642f46c3872a6311f2ab3d4c622f5f8625bfee8e1de2d0de42597c1385629  /tmp/zine.tar.xz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zine"
          tar -xJf /tmp/zine.tar.xz -C "$RUNNER_TEMP/zine"
          echo "$RUNNER_TEMP/zine" >> "$GITHUB_PATH"
      - run: bash scripts/build-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: penny-goblin-website
          path: public/
          if-no-files-found: error
          retention-days: 14
      - name: Load website-only deploy key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
      - name: Trust GitHub SSH host keys from its HTTPS metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          curl --fail --silent --show-error https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com " + key for key in json.load(sys.stdin)["ssh_keys"]))' >> ~/.ssh/known_hosts
      - name: Publish static website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/publish-site.sh
